[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-migration-tool"
version = "1.0.0"
description = "Migration tool for Docker-based robotics development environments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# authors / maintainers are intentionally left unset: fill them in for your own
# fork or distribution rather than shipping someone else's identity.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
keywords = ["docker", "migration", "robotics", "ros", "container"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
docker-migration = "docker_migration_tool.cli:main"

# [project.urls] is intentionally omitted until this repository has a real
# remote; a guessed Homepage/Repository URL would point at a project that does
# not exist.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require Docker daemon)",
    "slow: marks tests as slow",
]
addopts = "-v --tb=short"
